<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>تقييمات العملاء — معمار دجلة</title>

    <meta
      name="description"
      content="عرض تقييمات العملاء في معمار دجلة."
    />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Login Modal -->
    <div id="loginModal" class="modal">
      <img src="images/logo-one.png" alt="شعار معمار دجلة"  class="logo-login" style="display: block; margin: 0 auto 10px;" />
      <div class="modal-content">
        <h2>Employee Dashboard</h2>
        <form id="loginForm">
          <div class="form-group">

            <label for="password">كلمة المرور:</label>
            <input type="password" id="password" name="password" required>
          </div>
          <button type="submit" class="btn-primary">Login</button>
        </form>
        <div id="loginError" class="error-message"></div>
      </div>
    </div>

    <!-- Main Content Section -->
    <div class="employee-main-content" id="employeeContent" style="display: none;">
      <section class="card employee-card" style="width: 100%; animation: none;     border-radius: 0px;  background-image: linear-gradient(to top, #3c4043 0%, #8d9bb1ed 100%);     padding: 0px;" >
        <div class="intro" style="background: linear-gradient(135deg, rgb(177 0 0), rgb(18 16 16));
        border-radius: 8px;
        margin-top: 20px;">
          <div class="text-top-container" style="">
            <div class="intro-title intro-title-employee" style="font-size: 20px;"> customer evaluations feedback</div>
            
          </div>
        </div>

        <!-- Data Table -->
        <div class="table-section">
          <div class="table-container" style=" overflow-y: auto;">
            <table id="evaluationsTable">
              <thead>
                <tr>
                  <th>التاريخ</th>
                  <th>الاسم</th>
                  <th>الهاتف</th>
                  <th>السؤال 1</th>
                  <th>السؤال 2</th>
                  <th>السؤال 3</th>
                  <th>السؤال 4</th>
                  <th>التعليقات</th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <!-- Data will be populated here -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Logout Button -->
        <div class="reset-password-section">
          <button id="logoutBtn" class="btn-secondary">تسجيل الخروج</button>
        </div>
      </section>
    </div>

    <script src="employee.js"></script>
  </body>
</html>
